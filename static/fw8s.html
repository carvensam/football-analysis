<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>精選8s</title>
<style>
/* 2026-10-25 全局字體加大（同主 App 一致）；2026-10-26 手機 zoom 1.15 */
html{zoom:1}
@media (max-width:600px){html{zoom:1.15}}/* 2026-10-26 用戶校準：1.35 太大→1.15（~16px）
 * 想再調淨係改呢個數（1.0=細啲 1.3=大啲） */
img,table{max-width:100%}
:root{
  --bg:#0d1117; --bg2:#161d27; --card:#1a2230; --line:#2b3648;
  --tx:#e8e2d5; --dim:#8b94a3; --up:#3fb96c; --down:#e05c5c;
  --gold:#d4af37; --gold2:#f5d76e; --accent:#5b8def;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans TC",sans-serif;
  font-size:15px; line-height:1.55;
  padding:52px 0 54px;
}
a{color:var(--accent)}
.gold-banner{
  position:fixed; left:0; right:0; height:52px; z-index:50;
  background:linear-gradient(180deg,#e6c34a,#b8932a);
  color:#3a2c05; display:flex; align-items:center; justify-content:center;
  font-weight:900; letter-spacing:.12em; white-space:nowrap;
  font-size:40px; line-height:52px;
}
.gold-banner.top{top:0;border-bottom:2px solid #8a6d1a}
.gold-banner.bottom{bottom:0;border-top:2px solid #8a6d1a;font-size:32px}
#topbar{
  position:sticky; top:52px; z-index:40; margin:0 -10px;
  background:var(--bg2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:6px 10px; flex-wrap:wrap;
}
#status{font-size:13px;color:var(--dim);flex:1;min-width:120px}
.btn{
  background:var(--card); color:var(--tx); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#3a2c05; font-weight:700}
.btn:disabled{opacity:.45}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
#main{max-width:760px;margin:0 auto;padding:10px}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.err{color:#ffb0b0;background:#4a1d1d;border:1px solid #7a2d2d;border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
.hint{font-size:12px;color:var(--dim)}
/* 分頁掣 */
#tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
#tabs .tab{
  background:var(--card);color:var(--dim);border:1px solid var(--line);
  border-radius:18px;padding:5px 14px;font-size:13px;cursor:pointer;
}
#tabs .tab.on{color:var(--gold2);border-color:var(--gold);font-weight:700}
/* 統計條 */
.sumbar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:6px;margin:6px 0;
}
.si{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.si .t{color:var(--dim);font-size:11px}
.si .v{font-size:19px;font-weight:900;margin-top:2px}
.si .v.up{color:var(--up)}
.si .v.gold{color:var(--gold2)}
/* 賽事卡 */
.mrow{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; margin:6px 0;
}
.mrow.pick{border-color:#2c5c3c;box-shadow:0 0 0 1px #2c5c3c inset}
.mrow.watch{opacity:.75}
.mrow .m-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow .ko{font-size:12px;color:var(--dim);min-width:78px}
.mrow .lg{font-size:12px;color:var(--gold2);min-width:64px}
.mrow .tm{flex:1;min-width:150px;font-weight:600}
.mrow .ln{font-size:12px;color:var(--dim);text-align:right}
.mrow .ln b{color:var(--tx)}
.badge{
  font-size:12px;font-weight:800;padding:2px 10px;border-radius:12px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;
}
.badge.up{color:#7ee2a0;border-color:#2c5c3c;background:#12281a}
.badge.direct{color:var(--gold2);border-color:#6b5510;background:#241d0a}
.badge.refine{color:#9ecbff;border-color:#2b4a6b;background:#101c2c}
.badge.watchb{color:var(--dim)}
.mrow .sub{font-size:12px;color:var(--dim);margin-top:4px}
.mrow .sub b{color:var(--gold2)}
.sec-h{font-size:13px;font-weight:700;color:var(--gold2);margin:12px 0 4px}
/* 表格 */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
table.t th,table.t td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.t th{background:var(--bg2);color:var(--gold2);position:sticky;top:100px}
table.t td.l{text-align:left}
tr.mode-direct td:first-child{box-shadow:inset 3px 0 0 var(--up)}
tr.mode-refine td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.mode-watch td:first-child{box-shadow:inset 3px 0 0 var(--dim)}
.pc-up{color:#7ee2a0;font-weight:700}
.pc-dn{color:#e08c8c;font-weight:700}
.yrs{color:var(--dim);font-size:11px}
.res{font-weight:900;padding:1px 7px;border-radius:10px;font-size:12px}
.res.W{background:#12351f;color:#7ee2a0;border:1px solid #2c5c3c}
.res.L{background:#3a1515;color:#e08c8c;border:1px solid #5c2c2c}
.res.P{background:#2a2a1a;color:#d8cf8a;border:1px solid #4a4a2c}
.empty{color:var(--dim);text-align:center;padding:22px 0;font-size:14px}
.toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  background:#000d;border:1px solid var(--gold);color:var(--gold2);
  padding:8px 18px;border-radius:20px;font-size:14px;z-index:99;display:none;
}
@media (max-width:640px){
  body{font-size:14px;padding:0 0 16px}
  .gold-banner{position:static;height:34px;font-size:22px;line-height:34px}
  .gold-banner.bottom{height:26px;font-size:15px;line-height:26px}
  /* 2026-10-26：margin:0 -10px（桌面用）喺手機會令頂欄闊過熒幕 20px——status 文字被裁 */
  #topbar{top:0;margin:0;padding:4px 6px;gap:4px}
  #status{font-size:12px;min-width:0}
  .mrow .ko{min-width:0}
  .mrow .lg{min-width:0}
  .mrow .tm{min-width:0;flex-basis:100%}
  /* 保留真正 table 排版；只係外層橫掃，避免手機 display:block 令表頭／欄位消失 */
  table.t{display:table;min-width:650px;max-width:none}
  table.t th{position:static}
  .toast{bottom:16px;max-width:92vw}
}
</style>
</head>
<body>
<div class="gold-banner top">精選8s</div>
<header id="topbar">
  <span id="status">啟動中…</span>
  <select id="hoursSel">
    <option value="24">24小時</option>
    <option value="48" selected>48小時</option>
    <option value="72">72小時</option>
    <option value="168">7天</option>
  </select>
  <button class="btn gold" id="btnReload">⟳ 重新整理</button>
</header>
<main id="main">
<script src="league7.js?v=4" data-tool="8s"></script>
  <div class="note">專搵<b style="color:#7ee2a0">上盤</b>｜每個聯賽／杯賽獨立公式｜格共識方向為本＋歷史命中率過濾｜數據：易胜博(12BET) 尾盤為準</div>
  <div id="sumbar" class="sumbar"></div>
  <div id="tabs">
    <button class="tab on" data-t="up">🎯 即將開賽 <span id="upCnt"></span></button>
    <button class="tab" data-t="rules">📐 每聯賽公式</button>
    <button class="tab" data-t="bt">🏟 全庫實跑</button>
    <button class="tab" data-t="hist">📜 過往紀錄</button>
  </div>
  <div id="body"><div class="empty">載入中…</div></div>
</main>
<div class="gold-banner bottom">專搵上盤</div>
<div class="toast" id="toast"></div>
<script src="/static/fw8s.js?v=fw8s4"></script>
<script src="/static/crawlbtn.js?v=5.3.1"></script>
</body>
</html>
