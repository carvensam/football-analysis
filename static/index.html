<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FootballAnalysis</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1><img src="/static/icon.png" style="width:26px;height:26px;vertical-align:-5px;margin-right:6px">FootballAnalysis</h1>
  <div class="hdr-ctl">
    <select id="hours">
      <option value="24">未來24小時</option>
      <option value="48" selected>未來48小時</option>
      <option value="168">未來7天</option>
      <option value="0">全部即將開賽</option>
    </select>
    <button id="btnRefresh" class="btn">重新整理賽事</button>
    <button id="btnFetchAll" class="btn accent">獲取全部賠率</button>
    <button id="btnUpdate" class="btn" title="更新賽果＋新場次＋已存在場次嘅盤口及賠率全部刷新（約 5-10 分鐘）">⟳ 更新賽事</button>
    <button id="btnFeatured" class="btn gold" title="七重準則全通過嘅精選場次">★ 精選</button>
    <button id="btnCheck" class="btn" title="8 組合歷史開出上/下盤比例">✓ Check 下先</button>
    <button id="btnResults" class="btn" title="精選已開賽場次賽果＋五項命中率統計">📋 過往賽果</button>
    <button id="btnFeatLog" class="btn" title="精選一出現即自動紀錄（尾盤快照，永久保留，計一場）">📜 過往紀錄</button>
    <span id="status" class="status"></span>
  </div>
</header>

<main>
  <section id="listPane">
    <details id="picksPanel">
      <summary><span id="picksSum">我的選擇</span><button id="btnPicksBig" class="btn">⤢ 大版面</button></summary>
      <div id="picksBox">載入中…</div>
    </details>
    <h2>即將開賽</h2>
    <div id="matchList"><div class="empty">載入中…</div></div>
  </section>
  <section id="resultPane">
    <div id="placeholder" class="empty big">← 點選一場賽事開始篩查<br><small>未有賠率的場次請先按「獲取賠率」</small></div>
    <div id="result" style="display:none"></div>
  </section>
</main>
<div id="pkOverlay" style="display:none">
  <div class="pk-ov-head">
    <b id="pkOvTitle">我的選擇</b>
    <span id="pkOvStatus" class="ft-scan-info"></span>
    <button class="btn ov-refresh" title="更新最新即時盤口及賠率，並重算（包括精選）">⟳ 刷新盤口</button>
    <button id="pkOvClose" class="btn">✕ 關閉</button>
  </div>
  <div class="pk-ov-body" id="pkOvBody">載入中…</div>
</div>
<div id="ftOverlay" style="display:none">
  <div class="pk-ov-head">
    <b id="ftOvTitle">精選</b>
    <span id="ftScanInfo" class="ft-scan-info"></span>
    <button class="btn ov-refresh" title="更新最新即時盤口及賠率，並重算（包括精選）">⟳ 刷新盤口</button>
    <button id="btnFtScan" class="btn">🔍 掃描精選</button>
    <button id="ftOvClose" class="btn">✕ 關閉</button>
  </div>
  <div class="pk-ov-body" id="ftOvBody">載入中…</div>
</div>
<div id="ckOverlay" style="display:none">
  <div class="pk-ov-head">
    <b id="ckOvTitle">Check 下先</b>
    <span id="ckScanInfo" class="ft-scan-info"></span>
    <button class="btn ov-refresh" title="更新最新即時盤口及賠率，並重算（包括精選）">⟳ 刷新盤口</button>
    <button id="btnCkScan" class="btn">🔍 回測掃描</button>
    <button id="ckOvClose" class="btn">✕ 關閉</button>
  </div>
  <div class="pk-ov-body" id="ckOvBody">載入中…</div>
</div>
<div id="rsOverlay" style="display:none">
  <div class="pk-ov-head">
    <b id="rsOvTitle">過往賽果</b>
    <span id="rsInfo" class="ft-scan-info"></span>
    <button id="rsOvClose" class="btn">✕ 關閉</button>
  </div>
  <div class="pk-ov-body" id="rsOvBody">載入中…</div>
</div>
<div id="flOverlay" style="display:none">
  <div class="pk-ov-head">
    <b id="flOvTitle">過往紀錄</b>
    <span id="flInfo" class="ft-scan-info">精選一出現即自動紀錄</span>
    <button id="flOvClose" class="btn">✕ 關閉</button>
  </div>
  <div class="pk-ov-body" id="flOvBody">載入中…</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
