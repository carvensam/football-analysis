<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FootballAnalysis V2</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161d27; --card:#1a2230; --line:#2b3648;
  --tx:#e8e2d5; --dim:#8b94a3; --up:#3fb96c; --down:#e05c5c;
  --gold:#d4af37; --gold2:#f5d76e; --accent:#5b8def;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans TC",sans-serif;
  font-size:15px; line-height:1.55;
  padding:52px 0 56px; /* 上下金橫額高度 */
}
a{color:var(--accent)}
/* ---- 金色橫額（頂：冷靜．最強念力／底：悶住贏） ---- */
.gold-banner{
  position:fixed; left:0; right:0; height:52px; z-index:50;
  background:linear-gradient(180deg,#e6c34a,#b8932a);
  color:#3a2c05; display:flex; align-items:center; justify-content:center;
  font-weight:900; letter-spacing:.12em; white-space:nowrap;
  font-size:40px; line-height:52px;
}
.gold-banner.top{top:0;border-bottom:2px solid #8a6d1a}
.gold-banner.bottom{bottom:0;border-top:2px solid #8a6d1a}
/* ---- 頂部列 ---- */
#topbar{
  position:sticky; top:52px; z-index:40; margin:0 -10px;
  background:var(--bg2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:6px 10px; flex-wrap:wrap;
}
#status{font-size:12px;color:var(--dim);white-space:nowrap}
#status b{color:var(--up)}
#status .err{color:var(--down)}
#tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{
  background:var(--card); color:var(--tx); border:1px solid var(--line);
  border-radius:16px; padding:5px 12px; font-size:13px; cursor:pointer;
}
.tab.on{background:var(--gold); color:#3a2c05; border-color:var(--gold); font-weight:700}
.tab:disabled{opacity:.5}
/* ---- 主區 ---- */
#main{max-width:980px;margin:0 auto;padding:10px}
.pg{display:none}
.pg.on{display:block}
/* ---- 按掣 ---- */
.btn{
  background:var(--card); color:var(--tx); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.warn{background:#7a4a12; border-color:#a06a1f; color:#ffd9a0}
.btn:disabled{opacity:.45;cursor:default}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.toolbar select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
/* ---- 場次卡 ---- */
.day-h{
  margin:14px 0 6px; padding:4px 10px; background:var(--bg2);
  border-left:3px solid var(--gold); font-weight:700; font-size:14px;
  color:var(--gold2); border-radius:0 6px 6px 0;
}
.mrow{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; margin:6px 0; cursor:pointer;
}
.mrow:hover{border-color:var(--gold)}
.mrow .ko{font-size:12px;color:var(--dim);min-width:88px}
.mrow .lg{font-size:12px;color:var(--gold2);min-width:70px}
.mrow .tm{flex:1;min-width:180px;font-weight:600}
.mrow .tm .r{color:var(--dim);font-weight:400;font-size:12px}
.mrow .ln{font-size:12px;color:var(--dim);text-align:right}
.mrow .ln b{color:var(--tx)}
.mrow .od{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.mrow .od.has{color:var(--up);border-color:#2c5c3c}
.mrow .sc{font-weight:800;color:var(--gold2);font-size:16px}
/* ---- 詳情頁 ---- */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.tcard h2{font-size:19px;margin-bottom:4px}
.tcard .meta{color:var(--dim);font-size:13px;margin-bottom:8px}
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px}
.linebox{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.linebox .lb-t{font-size:11px;color:var(--dim)}
.linebox .lb-v{font-size:14px;font-weight:700;margin-top:2px}
.linebox .lb-v small{color:var(--dim);font-weight:400}
/* ---- 摺疊項 ---- */
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0}
details summary{
  list-style:none;cursor:pointer;padding:9px 12px;display:flex;gap:8px;
  align-items:baseline;flex-wrap:wrap;font-weight:600;font-size:14px;
}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸';color:var(--gold);font-size:12px}
details[open] summary::before{content:'▾'}
details summary .sub{color:var(--dim);font-weight:400;font-size:12px}
.gi .sub,.gaprow .sub{color:var(--dim);font-size:11px;line-height:1.35;margin-top:2px}
details .body{padding:4px 12px 12px;border-top:1px solid var(--line)}
/* ---- 表 ---- */
table.ck-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.ck-table th,table.ck-table td{
  border:1px solid var(--line);padding:4px 8px;text-align:center}
table.ck-table th{background:var(--bg2);color:var(--gold2);font-weight:700}
table.ck-table td.hl,table.ck-table tr.hl td{background:#6b5a14}
.r-up{color:var(--up)} .r-down{color:var(--down)}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.err{color:#ffb0b0;background:#4a1d1d;border:1px solid #7a2d2d;border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.tag.up{background:#1c4a2c;color:#7ee2a0}
.tag.down{background:#4a1d1d;color:#ff9d9d}
.tag.lt{background:#3a2c6b;color:#c9b8ff}
.tag.dim{background:var(--bg2);color:var(--dim)}
/* ---- 精選／選擇卡 ---- */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.fcard .f-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fcard .f-time{color:var(--dim);font-size:12px}
.fcard .f-teams{font-weight:700;flex:1;min-width:170px}
.fcard .f-score{font-weight:800;color:var(--gold2)}
.fcard .f-btns{display:flex;gap:6px}
.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:8px}
.gi{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.gi .t{color:var(--dim);font-size:11px}
.gi .v{font-size:12px;margin-top:2px}
.gaprow{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;margin-top:6px}
.gaprow .lab{color:var(--gold2);font-weight:700;margin-right:6px}
.statbar{display:flex;gap:10px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.statbar b{color:var(--gold2)}
/* ---- 走勢 ---- */
.trend{display:flex;gap:3px;align-items:flex-end;height:70px;margin:10px 0;border-bottom:1px solid var(--line);padding:0 4px}
.trend .bar{flex:1;min-width:8px;border-radius:3px 3px 0 0;position:relative}
.trend .bar.hi{background:var(--up)} .trend .bar.lo{background:var(--down)}
.trend .bar:hover::after{
  content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:#000;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}
/* ---- 設定 ---- */
.set-doc details{margin:8px 0}
.set-tb{width:100%;border-collapse:collapse;font-size:13px}
.set-tb th,.set-tb td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.set-tb th{background:var(--bg2);color:var(--gold2);white-space:nowrap}
.set-sec p{margin:6px 0;font-size:13px}
.toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  background:#000d;border:1px solid var(--gold);color:var(--gold2);
  padding:8px 18px;border-radius:20px;font-size:14px;z-index:99;display:none;
}
.checkwrap{overflow-x:auto}
.hint{font-size:12px;color:var(--dim)}
/* 手機 */
@media (max-width:640px){
  body{font-size:14px;padding:44px 0 48px}
  .gold-banner{height:44px;font-size:32px;line-height:44px}
  #topbar{top:44px}
  .mrow .ko{min-width:70px}
}
</style>
</head>
<body>
<div class="gold-banner top">冷靜．最強念力</div>

<header id="topbar">
  <span id="status">啟動中…</span>
  <nav id="tabs">
    <button class="tab on" data-pg="home">🏠 主頁</button>
    <button class="tab" data-pg="feat">★ 精選 <span id="ftCnt"></span></button>
    <button class="tab" data-pg="featz">★ 精選Z <span id="ftzCnt"></span></button>
    <button class="tab" data-pg="check">✓ Check 下先</button>
    <button class="tab" data-pg="picks">我的選擇 <span id="pkCnt"></span></button>
    <button class="tab" data-pg="results">📋 過往賽果</button>
    <button class="tab" data-pg="featlog">📜 過往紀錄</button>
    <button class="tab" data-pg="v1">📼 舊版本</button>
    <button class="tab" data-pg="settings">⚙️ 設定</button>
  </nav>
</header>

<main id="main">
  <!-- 主頁 -->
  <section class="pg on" id="pg-home">
    <div class="toolbar">
      <select id="hoursSel">
        <option value="24">未來24小時</option>
        <option value="48" selected>未來48小時</option>
        <option value="168">未來7天</option>
        <option value="0">全部（不設上限）</option>
      </select>
      <button class="btn" id="btnReload">重新整理賽事</button>
      <button class="btn" id="btnFetchAll">獲取全部賠率</button>
      <button class="btn warn" id="btnUpdate">⟳ 更新賽事</button>
      <button class="btn accent" id="btnWin24">⚡ 更新未來24</button>
      <button class="btn accent" id="btnWin30">⚡ 更新未來30分鐘</button>
      <button class="btn accent" id="btnWin10">⚡ 更新未來10分鐘</button>
      <span class="hint" id="updInfo"></span>
    </div>
    <div id="homeList"><div class="note">載入中…</div></div>
  </section>

  <!-- 精選 -->
  <section class="pg" id="pg-feat">
    <div class="toolbar">
      <button class="btn accent" id="btnFtScan">🔍 重新掃描精選</button>
      <span class="hint" id="ftScanInfo"></span>
    </div>
    <div id="ftStats"></div>
    <div id="ftList"><div class="note">載入中…</div></div>
  </section>

  <!-- 精選Z -->
  <section class="pg" id="pg-featz">
    <div class="toolbar">
      <button class="btn accent" id="btnFtzScan">🔍 重新掃描精選Z</button>
      <span class="hint" id="ftzScanInfo"></span>
    </div>
    <div id="ftzStats"></div>
    <div id="ftzList"><div class="note">載入中…</div></div>
  </section>

  <!-- Check 下先 -->
  <section class="pg" id="pg-check">
    <div id="ckBody"><div class="note">載入中…</div></div>
  </section>

  <!-- 我的選擇 -->
  <section class="pg" id="pg-picks">
    <div id="pkStats"></div>
    <div id="pkList"><div class="note">載入中…</div></div>
  </section>

  <!-- 過往賽果 -->
  <section class="pg" id="pg-results">
    <div class="toolbar">
      <label class="hint">範圍
        <select id="rsScope">
          <option value="featured" selected>精選</option>
          <option value="featuredz">精選Z</option>
        </select></label>
      <label class="hint">聯賽 <select id="rsLg"><option value="">全部</option></select></label>
      <label class="hint">盤口 <select id="rsLn"><option value="">全部</option></select></label>
      <label class="hint">勝負
        <select id="rsWin">
          <option value="" selected>全部</option>
          <option value="win">贏超50%</option>
          <option value="lose">輸超50%</option>
        </select></label>
      <span class="hint" id="rsInfo"></span>
    </div>
    <div id="rsBody"><div class="note">載入中…</div></div>
  </section>

  <!-- 過往紀錄 -->
  <section class="pg" id="pg-featlog">
    <div class="toolbar">
      <label class="hint">紀錄
        <select id="flZ"><option value="" selected>精選</option><option value="1">精選Z</option></select></label>
      <span class="hint">精選一出現即自動紀錄（尾盤快照，永久保留，計一場）</span>
    </div>
    <div id="flStats"></div>
    <div id="flList"><div class="note">載入中…</div></div>
  </section>

  <!-- 舊版本（V1 精選／精選Z） -->
  <section class="pg" id="pg-v1">
    <div class="toolbar">
      <button class="btn accent" id="btnV1Scan">🔍 重新掃描 V1</button>
      <span class="hint" id="v1ScanInfo"></span>
    </div>
    <div id="v1Stats"></div>
    <div id="v1List"><div class="note">載入中…</div></div>
    <div id="v1zStats"></div>
    <div id="v1zList"></div>
  </section>

  <!-- 設定 -->
  <section class="pg" id="pg-settings">
    <div class="set-doc" id="setBody"></div>
  </section>

  <!-- 詳情（場次） -->
  <section class="pg" id="pg-detail">
    <div class="toolbar">
      <button class="btn" id="btnBack">← 返主頁</button>
      <button class="btn warn" id="btnDetFetch">獲取賠率</button>
      <button class="btn accent" id="btnDetRefresh">⟳ 重新整理盤口及水位</button>
      <span class="hint" id="detMsg"></span>
    </div>
    <div id="detBody"><div class="note">載入中…</div></div>
  </section>
</main>

<div class="gold-banner bottom">悶住贏</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
