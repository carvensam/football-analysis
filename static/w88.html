<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>88W</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161d27; --card:#1a2230; --line:#2b3648;
  --tx:#e8e2d5; --dim:#8b94a3; --up:#3fb96c; --down:#e05c5c;
  --gold:#d4af37; --gold2:#f5d76e; --accent:#5b8def; --draw:#b98cff;
  --even:#4fd1c5; --over:#f0a35e; --under:#6aa9ff; --home:#ffd166; --away:#7ce7f4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans TC",sans-serif;
  font-size:15px; line-height:1.55; padding:52px 0 20px;
}
.gold-banner{
  position:fixed; left:0; right:0; top:0; height:52px; z-index:50;
  background:linear-gradient(180deg,#e6c34a,#b8932a);
  color:#3a2c05; display:flex; align-items:center; justify-content:center;
  font-weight:900; letter-spacing:.3em; font-size:34px; line-height:52px;
  border-bottom:2px solid #8a6d1a;
}
#topbar{
  position:sticky; top:52px; z-index:40;
  background:var(--bg2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:6px 10px; flex-wrap:wrap;
}
#status{font-size:13px;color:var(--dim);flex:1;min-width:120px}
.btn{
  background:var(--card); color:var(--tx); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2c05;font-weight:700}
.btn:disabled{opacity:.45}
#main{max-width:860px;margin:0 auto;padding:10px}
.sumbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:8px 0}
.si{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.si .t{color:var(--dim);font-size:11px}
.si .v{font-size:19px;font-weight:900;margin-top:2px}
.si .v.up{color:var(--up)} .si .v.down{color:var(--down)}
.si .v.gold{color:var(--gold2)} .si .v.draw{color:var(--draw)}
h2.sec{font-size:16px;color:var(--gold2);margin:16px 0 6px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.mrow.hit{border-color:#2c5c3c}
.mrow .m-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ko{font-size:12px;color:var(--dim)}
.lg{font-size:12px;color:var(--gold2)}
.tm{flex:1;min-width:150px;font-weight:600}
.tag{font-size:12px;font-weight:800;padding:2px 10px;border-radius:12px;border:1px solid var(--line);color:var(--dim)}
.tag.w{color:var(--up);border-color:var(--up)}
.tag.l{color:var(--down);border-color:var(--down)}
.tag.p{color:var(--dim);border-color:var(--dim)}
.sub{font-size:12px;color:var(--dim);margin-top:4px}
.mkt-up{color:var(--up);border-color:var(--up)}
.mkt-down{color:var(--down);border-color:var(--down)}
.mkt-draw{color:var(--draw);border-color:var(--draw)}
.mkt-even{color:var(--even);border-color:var(--even)}
.mkt-over{color:var(--over);border-color:var(--over)}
.mkt-under{color:var(--under);border-color:var(--under)}
.mkt-home{color:var(--home);border-color:var(--home)}
.mkt-away{color:var(--away);border-color:var(--away)}
table.lib{width:100%;border-collapse:collapse;font-size:13px}
table.lib th,table.lib td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.lib th{color:var(--gold2);position:sticky;top:104px;background:var(--bg2)}
.rlab{font-weight:800;white-space:nowrap}
.rmeta{font-size:12px;color:var(--dim)}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.err{color:#ffb0b0;background:#4a1d1d;border:1px solid #7a2d2d;border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
/* 手機（Xiaomi 14，393px）：橫額隨捲動走唔阻內容；頂欄貼頂；表可橫掃 */
@media (max-width:640px){
  body{font-size:14px;padding:0 0 16px}
  .gold-banner{position:static;height:34px;font-size:22px;line-height:34px;letter-spacing:.15em}
  #topbar{top:0;padding:4px 6px;gap:4px}
  .btn{padding:5px 10px;font-size:13px}
  #main{padding:6px}
  .mrow .tm{min-width:0;flex-basis:100%;order:3}
  table.lib{display:block;overflow-x:auto;max-width:100%}
  table.lib th{position:static}
}
</style>
</head>
<body>
<div class="gold-banner">88W</div>
<div id="topbar">
  <span id="status">載入緊…</span>
  <button class="btn gold" id="btnScan" onclick="doScan()">⚡ 一鍵掃描預測</button>
  <button class="btn" onclick="location.href='/'">← 主頁</button>
  <button class="btn" onclick="load()">重新整理</button>
</div>
<div id="main">
  <div class="sumbar" id="sum"></div>
  <div class="note">全市場逐聯賽方法庫（2026-10-19 挖掘）：每個聯賽/杯賽 ≥4 個方法，訓練期 ≤2024 ＋ 驗證期 2025+ 兩邊命中率都 ≥72.5%。市場：<b class="mkt-up" style="border:0">K3上盤</b>／<b class="mkt-down" style="border:0">K3下盤</b>／<b class="mkt-draw" style="border:0">K3開發雙數和波</b>／<b class="mkt-even" style="border:0">雙數</b>／<b class="mkt-over" style="border:0">K3大球</b>／<b class="mkt-under" style="border:0">K3細球</b>／<b class="mkt-home" style="border:0">K3主勝</b>／<b class="mkt-away" style="border:0">K3客勝</b>。和波一定係雙數。</div>
  <h2 class="sec">🎯 預測紀錄（全部市場）</h2>
  <div id="predbody"></div>
  <h2 class="sec">📚 逐聯賽方法庫（<span id="libn"></span> 個聯賽/杯賽）</h2>
  <div id="lib"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtLine(hc, gv){
  if (hc == null) return '—';
  if (gv == null || gv === 'none') return '平手';
  const n = {0.25:'平/半',0.5:'半球',0.75:'半/一',1:'一球',1.25:'一/球半',1.5:'球半',1.75:'球半/兩',2:'兩球',2.25:'兩/兩半',2.5:'兩半',2.75:'兩半/三',3:'三球'}[hc] || hc;
  return (gv === 'home' ? '主讓' : '客讓') + n;
}
const MKT_CLASS = {ah_up:'mkt-up', ah_down:'mkt-down', draw:'mkt-draw', even:'mkt-even',
  over:'mkt-over', under:'mkt-under', home_win:'mkt-home', away_win:'mkt-away'};
const MKT_WIN_TXT = {ah_up:'上盤贏', ah_down:'下盤贏', draw:'和', even:'雙數',
  over:'大', under:'細', home_win:'主勝', away_win:'客勝'};
const COND_TXT = {
  hc0:'平手盤', hc025:'讓≤平/半', hc05:'讓≤半球', hc075:'讓半/一', hc_deep:'深盤≥球半',
  gv_home:'主讓', gv_away:'客讓',
  ou_le20:'大小線≤2.0', ou_le25:'大小線≤2.5', ou_ge30:'大小線≥3.0',
  ou_drop:'大小線降盤', ou_rise:'大小線升盤',
  uw_lo:'上盤低水', uw_hi:'上盤高水',
  ah_deep:'讓球升盤', ah_shallow:'讓球降盤',
  rank_h5:'主排名高5+', rank_a5:'客排名高5+', rank_close:'排名差≤3',
  hh_wr_hi:'主隊主場勝率≥60%', aa_wr_lo:'客隊客場勝率≤30%',
  hh_wr_lo:'主隊主場勝率≤30%', aa_wr_hi:'客隊客場勝率≥55%',
  avg_hi:'場均總入球≥3.0', avg_lo:'場均總入球≤2.3',
  hh_gf_hi:'主隊主場场均入≥1.8', aa_gf_hi:'客隊客場场均入≥1.8',
  hh_ga_hi:'主隊主場场均失≥1.5', aa_ga_hi:'客隊客場场均失≥1.5'};
const condTxt = c => COND_TXT[c] || c;
async function load(){
  $('#status').textContent = '載入緊…';
  try {
    const r = await fetch('/api/w88/full');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    const st = d.stats;
    const dec = st.w + st.l, hr = dec ? (st.w / dec * 100).toFixed(1) + '%' : '—';
    const lib = d.library;
    const nMethods = lib.reduce((a, x) => a + (x.methods ? x.methods.length : 0), 0);
    $('#sum').innerHTML =
      `<div class="si"><div class="t">聯賽/杯賽</div><div class="v gold">${lib.length}</div></div>` +
      `<div class="si"><div class="t">方法總數</div><div class="v gold">${nMethods}</div></div>` +
      `<div class="si"><div class="t">實戰 中/唔中</div><div class="v"><span style="color:var(--up)">${st.w}</span>/<span style="color:var(--down)">${st.l}</span></div></div>` +
      `<div class="si"><div class="t">實戰命中率</div><div class="v ${dec && st.w/dec>=0.725?'up':'gold'}">${hr}</div></div>` +
      `<div class="si"><div class="t">待定</div><div class="v gold">${st.pending}</div></div>` +
      `<div class="si"><div class="t">走盤</div><div class="v">${st.push}</div></div>`;
    let h = '';
    if (!d.rows.length) h = '<div class="note">暫無記錄。背景每 20 分鐘自動掃描未來 7 日場次，亦可按「⚡ 一鍵掃描預測」。</div>';
    for (const r of d.rows){
      const mc = MKT_CLASS[r.market] || '';
      const wt = MKT_WIN_TXT[r.market] || '中';
      const badge = r.result === 'W' ? `<span class="tag w">✔ ${wt}</span>`
        : r.result === 'L' ? '<span class="tag l">✘ 唔中</span>'
        : r.result === 'P' ? '<span class="tag p">走盤</span>'
        : '<span class="tag" style="color:var(--gold2);border-color:#6b5510">⏳ 待定</span>';
      h += `<div class="mrow ${r.result==='W'?'hit':''}"><div class="m-top">
        <span class="ko">${esc((r.kickoff||'').slice(5,16))}</span>
        <span class="lg">${esc(r.league)}</span>
        <b class="tm">${esc(r.home)} <span style="color:var(--dim)">vs</span> ${esc(r.away)}</b>
        <span class="tag ${mc}">${esc(r.label || r.market)}</span>${badge}</div>
        <div class="sub">條件：${r.conds.map(condTxt).join('＋')}　盤口：${fmtLine(r.hc, r.giver)}　大小線：${r.ou_line ?? '—'}
        ${r.score ? `　賽果：<b>${esc(r.score)}</b>` : ''}</div></div>`;
    }
    $('#predbody').innerHTML = h;
    $('#libn').textContent = lib.length;
    let t = `<table class="lib"><tr><th>聯賽/杯賽</th><th>方法（全市場）</th></tr>`;
    for (const L of lib){
      const cells = [];
      if (L.formula) cells.push(`<div><span class="rlab ${L.formula.dir==='up'?'mkt-up':'mkt-down'}" style="border:0">${esc(L.formula.label)}</span> <span class="rmeta">8X公式・命中率 ${(L.formula.hit*100).toFixed(1)}%・n=${L.formula.n}</span></div>`);
      for (const m of (L.methods || [])){
        const mc = MKT_CLASS[m.market] || '';
        cells.push(`<div><span class="rlab ${mc}" style="border:0">${esc(m.label || m.market)}</span> <span class="rmeta">${m.conds.map(condTxt).join('＋')}｜訓練 ${(m.train_hit*100).toFixed(1)}%(n=${m.train_n})・驗證 ${(m.test_hit*100).toFixed(1)}%(n=${m.test_n})</span></div>`);
      }
      t += `<tr><td style="white-space:nowrap">${esc(L.league)}</td><td>${cells.join('')}</td></tr>`;
    }
    $('#lib').innerHTML = t + '</table>';
    $('#status').textContent = '最後更新 ' + new Date().toLocaleTimeString('zh-HK', {hour12:false});
  } catch (e) {
    $('#status').textContent = '載入失敗';
    $('#predbody').innerHTML = '<div class="err">載入失敗：' + esc(e.message || e) + '</div>';
  }
}
async function doScan(){
  const b = $('#btnScan');
  b.disabled = true;
  $('#status').textContent = '掃描緊（88W 全市場＋8X上下盤公式）…';
  try {
    const r = await fetch('/api/w88/scan', {method: 'POST'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    $('#status').textContent = `掃描完成：88W +${d.k3_added} 條・結算 ${d.k3_settled} 條` +
      (d.x8_added != null ? `｜8X上下盤 +${d.x8_added} 場・結算 ${d.x8_settled} 場` : '');
  } catch (e) {
    $('#status').textContent = '掃描失敗：' + (e.message || e);
  }
  b.disabled = false;
  load();
}
load();
</script>
</body>
</html>
