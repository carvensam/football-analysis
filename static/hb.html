<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>好波</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161d27; --card:#1a2230; --line:#2b3648;
  --tx:#e8e2d5; --dim:#8b94a3; --up:#3fb96c; --down:#e05c5c;
  --gold:#d4af37; --gold2:#f5d76e; --accent:#5b8def;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans TC",sans-serif;
  font-size:15px; line-height:1.55;
  padding:52px 0 54px;
}
a{color:var(--accent)}
.gold-banner{
  position:fixed; left:0; right:0; height:52px; z-index:50;
  background:linear-gradient(180deg,#e6c34a,#b8932a);
  color:#3a2c05; display:flex; align-items:center; justify-content:center;
  font-weight:900; letter-spacing:.12em; white-space:nowrap;
  font-size:40px; line-height:52px;
}
.gold-banner.top{top:0;border-bottom:2px solid #8a6d1a}
.gold-banner.bottom{bottom:0;border-top:2px solid #8a6d1a;font-size:32px}
#topbar{
  position:sticky; top:52px; z-index:40; margin:0 -10px;
  background:var(--bg2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:6px 10px; flex-wrap:wrap;
}
#status{font-size:13px;color:var(--dim);flex:1;min-width:120px}
.btn{
  background:var(--card); color:var(--tx); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#3a2c05; font-weight:700}
.btn:disabled{opacity:.45}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
#main{max-width:760px;margin:0 auto;padding:10px}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.err{color:#ffb0b0;background:#4a1d1d;border:1px solid #7a2d2d;border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
.hint{font-size:12px;color:var(--dim)}
/* 賽事卡 */
.mrow{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; margin:6px 0; cursor:pointer;
}
.mrow:hover{border-color:var(--gold)}
.mrow .m-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow .ko{font-size:12px;color:var(--dim);min-width:78px}
.mrow .lg{font-size:12px;color:var(--gold2);min-width:64px}
.mrow .tm{flex:1;min-width:150px;font-weight:600}
.mrow .ln{font-size:12px;color:var(--dim);text-align:right}
.mrow .ln b{color:var(--tx)}
.mrow .lean{
  font-size:12px;font-weight:800;padding:2px 10px;border-radius:12px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;
}
.mrow .lean.big{color:#ffd766;border-color:#6b5510;background:#241d0a}
.mrow .lean.small{color:#7ee2a0;border-color:#2c5c3c;background:#12281a}
.mrow .body{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:none}
.mrow.open .body{display:block}
.spin{font-size:12px;color:var(--dim)}
/* 詳情格 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:6px 0}
.gi{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.gi .t{color:var(--dim);font-size:11px}
.gi .v{font-size:14px;font-weight:700;margin-top:2px}
.gi .v small{color:var(--dim);font-weight:400}
.sec-h{font-size:13px;font-weight:700;color:var(--gold2);margin:10px 0 4px}
/* 半全場 9 格 */
table.htft{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
table.htft th,table.htft td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.htft th{background:var(--bg2);color:var(--gold2)}
table.htft td.top{background:rgba(255,200,40,.30);font-weight:800}
table.htft td.yl{background:#ffd766;color:#3a2c05;font-weight:900}
table.htft td.gn{background:#3fb96c;color:#0a2413;font-weight:900}
.htft-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.htft-cap{font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.htft-pt{font-size:13px;font-weight:700;margin:8px 0 2px}
@media (max-width:640px){.htft-pair{grid-template-columns:1fr}}
/* 關係表 */
table.rel{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
table.rel th,table.rel td{border:1px solid var(--line);padding:4px 8px;text-align:center}
table.rel th{background:var(--bg2);color:var(--gold2)}
.big-pct{font-size:20px;font-weight:900}
.pct-over{color:#ffd766}
.pct-under{color:#7ee2a0}
.toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  background:#000d;border:1px solid var(--gold);color:var(--gold2);
  padding:8px 18px;border-radius:20px;font-size:14px;z-index:99;display:none;
}
@media (max-width:640px){
  body{font-size:14px;padding:44px 0 46px}
  .gold-banner{height:44px;font-size:32px;line-height:44px}
  .gold-banner.bottom{font-size:26px}
  #topbar{top:44px}
}
</style>
</head>
<body>
<div class="gold-banner top">好波</div>
<header id="topbar">
  <span id="status">啟動中…</span>
  <select id="hoursSel">
    <option value="24">24小時</option>
    <option value="48" selected>48小時</option>
    <option value="72">72小時</option>
    <option value="168">7天</option>
  </select>
  <button class="btn gold" id="btnReload">⟳ 重新整理</button>
</header>
<main id="main">
  <div class="note">大小球＋半全場預測｜數據：易胜博(12BET) 尾盤為準｜撳場次展開預測</div>
  <div id="list"><div class="note">載入中…</div></div>
</main>
<div class="gold-banner bottom">悶住贏</div>
<div class="toast" id="toast"></div>
<script src="/static/hb.js?v=5.4.1"></script>
</body>
</html>
