# Render Blueprint： football-analysis
services:
  - type: web
    name: football-analysis
    runtime: docker
    # plan 唔寫死——保留服務而家嘅方案（付費版先支援永久硬碟）
    healthCheckPath: /api/ready
    # 永久硬碟：數據庫放呢度。10GB——908MB 庫每日漲 ~70MB，
    # 1GB/2GB 遲早再爆（2026-10-01 事故：複製中途爆碟→malformed 死循環）
    disk:
      name: football-data
      mountPath: /data
      sizeGB: 10
    envVars:
      # 數據庫放永久硬碟（app.py 啟動時會由映像種子複製一次）
      - key: DB_PATH
        value: /data/football.db
      # 數據庫 release asset（build 階段下載焗入映像做種子）
      - key: DB_URL
        value: https://github.com/carvensam/football-analysis/releases/download/db-20260920/football.db
      # titan007 長期封鎖 datacenter IP——雲端直接爬注定失敗；
      # 數據由本機每日朝早推送（更新雲端數據.py → GitHub → 重新部署），
      # 閂咗雲端自動更新免得主機每 30 秒白探＋頂部常駐「更新失敗」警告（2026-09-30）
      - key: DISABLE_UPDATE
        value: "1"
      # 2026-10-17 用戶拍板新架構：雲端爬蟲節點完全閂閉——512MB 全部留俾
      # web app，負荷大減、操作流暢。數據流改為：
      #  ① 本機（此電腦）定時定點爬取全量盤口/賠率（代理池+6 worker+fast_curl）
      #  ② 手機開 APP／手動⚡掣時直爬（PhoneCrawl，手機 IP 未被 titan007 封）
      #  ③ 賽事完畢後本機爬賽果→更新大數據庫＋各樣預測結果
      #  ④ 本機每日推送（更新雲端數據.py → GitHub Release → Render 重部署）
      # 舊制（10-12~10-16：雲端節點嵌入 web 進程爬）已廢——即使限時輪班
      # 都仍然同 web 服務擠 RAM/CPU/DB 鎖（90 分鐘 OOM 一次嘅元凶）。
      # ENABLE_CLOUD_CRAWL=0 閂死；下面三個 env 留低紀錄，想重開先至有用。
      - key: ENABLE_CLOUD_CRAWL
        value: "0"
      - key: CRAWL_THREADS
        value: "2"
      # 10-16：每輪爬取限時 20 分鐘（cloud_crawl 寫 control stop 收爐）——
      # 舊版一輪冇限時，積壓大時變相 24/7 霸 512MB 同 web 服務擠（OOM
      # 約 90 分鐘一次嘅元兇）。限時輪班後 web 有喘息窗；爬慢唔影響推算。
      - key: CRAWL_ROUND_MINUTES
        value: "20"
      # 10-16：好波預測快取上限 512MB 雲端減半（每 entry 50-100KB）——
      # 精確零影響，precompute 每 4 分鐘補返最近場次。
      - key: HB_PRE_MAX
        value: "250"
