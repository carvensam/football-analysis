# Render Blueprint： football-analysis
services:
  - type: web
    name: football-analysis
    runtime: docker
    # plan 唔寫死——保留服務而家嘅方案
    healthCheckPath: /api/ready
    # 注意：唔設永久硬碟。908MB 數據庫放 1GB 硬碟必定爆（複製都冇位），
    # 2026-09-30 搞到截斷庫＋長時間 502。而家直接用映像焗入嘅 /app/football.db，
    # 每次部署都係最新 DB；代價係重新部署清「我的選擇」記錄（使用說明已載）。
    envVars:
      # 數據庫直接用映像焗入嘅（Dockerfile 下載 db release 做種子）
      - key: DB_PATH
        value: /app/football.db
      # 數據庫 release asset（build 階段下載焗入映像做種子）
      - key: DB_URL
        value: https://github.com/carvensam/football-analysis/releases/download/db-20260920/football.db
      # titan007 長期封鎖 datacenter IP——雲端直接爬注定失敗；
      # 數據由本機每日朝早推送（更新雲端數據.py → GitHub → 重新部署），
      # 閂咗雲端自動更新免得主機每 30 秒白探＋頂部常駐「更新失敗」警告（2026-09-30）
      - key: DISABLE_UPDATE
        value: "1"
