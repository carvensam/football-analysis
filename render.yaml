# Render Blueprint： football-analysis
services:
  - type: web
    name: football-analysis
    runtime: docker
    # plan 唔寫死——保留服務而家嘅方案（付費版先支援永久硬碟）
    healthCheckPath: /api/ready
    # 永久硬碟：數據庫放呢度。10GB——908MB 庫每日漲 ~70MB，
    # 1GB/2GB 遲早再爆（2026-10-01 事故：複製中途爆碟→malformed 死循環）
    disk:
      name: football-data
      mountPath: /data
      sizeGB: 10
    envVars:
      # 數據庫放永久硬碟（app.py 啟動時會由映像種子複製一次）
      - key: DB_PATH
        value: /data/football.db
      # 數據庫 release asset（build 階段下載焗入映像做種子）
      - key: DB_URL
        value: https://github.com/carvensam/football-analysis/releases/download/db-20260920/football.db
      # titan007 長期封鎖 datacenter IP——雲端直接爬注定失敗；
      # 數據由本機每日朝早推送（更新雲端數據.py → GitHub → 重新部署），
      # 閂咗雲端自動更新免得主機每 30 秒白探＋頂部常駐「更新失敗」警告（2026-09-30）
      - key: DISABLE_UPDATE
        value: "1"
      # 2026-10-12 分工爬取：開機探測 titan007 各主機，通咗嘅市場喺本進程
      # 背景線程爬（本機 IP 被硬封鎖行代理池；雲端節點 IP 直達唔使代理）。
      # 爬完寫 /data/football.db——手機 API 即刻有新數據，本機經
      # /api/export/odds pull 返去 merge。 worker 服務冇獨立硬碟，
      # 所以嵌入 web 進程（佢有 /data 永久碟），零額外成本。
      # CRAWL_THREADS：export 減載（5000行/頁）後 4→6——之前 20k/頁 export
      # 風 storm + 8 線曾經 OOM 冧機（2026-10-12 05:45 實測）
      - key: ENABLE_CLOUD_CRAWL
        value: "1"
      - key: CRAWL_THREADS
        value: "6"
